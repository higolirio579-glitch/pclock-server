# Mantem o servidor do PCLock acordado (o Render gratis dorme depois de ~15 min sem acesso).
# So acessa a pagina; nao usa segredo nenhum.
name: keep-alive
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
permissions: {}
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Acessa o servidor
        run: curl -sS -m 60 -o /dev/null -w "HTTP %{http_code}\n" https://pclock-higo.onrender.com/manifest.json || true
